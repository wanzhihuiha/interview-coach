spring:
  datasource:
    url: jdbc:h2:file:D:/claude/workstation/interview-coach/backend/data/h2/interview_coach_local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      # 数据保留策略：未修改实体/表结构时，update 不会删除已有数据。
      # 如需重建 schema，请临时改为 create-drop，并在改造完成后恢复为 update。
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  sql:
    init:
      # data.sql 使用 MERGE INTO，重复启动时仅做 upsert，不会清空历史数据。
      mode: always
      data-locations: classpath:data.sql

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}

  ai:
    dashscope:
      enabled: false
    openai:
      enabled: false

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-please-change-in-production}
  expiration-days: ${JWT_EXPIRATION_DAYS:7}

resume:
  upload:
    max-size: 10485760
    storage-path: D:/claude/workstation/interview-coach/backend/uploads/resumes
  llm:
    # 本地开发启用真实 LLM 测试时改为 true，并配置对应厂商的 api-key 环境变量
    enabled: true
    timeout-seconds: 60
    retry-times: 1
    temperature: 0.3
    max-tokens: 4096
    top-p: 0.9
    vendors:
      dashscope:
        type: DASHSCOPE
        enabled: false
        api-key: ${DASHSCOPE_API_KEY:}
        model: qwen-plus
      openai:
        type: OPENAI_COMPATIBLE
        enabled: false
        api-key: ${OPENAI_API_KEY:}
        base-url: https://api.openai.com
        model: gpt-3.5-turbo
      zhipu:
        type: OPENAI_COMPATIBLE
        enabled: false
        api-key: ${ZHIPU_API_KEY:}
        base-url: https://open.bigmodel.cn/api/paas/v4
        model: glm-4
      minimax:
        # sk-cp- 开头的订阅密钥使用 Anthropic Messages 协议，
        # 因此类型需设置为 ANTHROPIC_COMPATIBLE，base-url 以 /anthropic 结尾。
        type: ANTHROPIC_COMPATIBLE
        enabled: true
        api-key: ${MINIMAX_API_KEY:your_api_key}
        base-url: https://api.minimaxi.com/anthropic
        model: MiniMax-M3
    tiers:
      l1:
        primary: minimax
        fallback: minimax
      l2:
        primary: minimax
        fallback: minimax
      l3:
        primary: minimax
        fallback: minimax

position:
  upload:
    max-size: 10485760
    storage-path: D:/claude/workstation/interview-coach/backend/uploads/positions
